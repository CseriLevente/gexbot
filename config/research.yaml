# Research profile -- USABLE.
#
# This is the only profile intended to run. It drives the synthetic adapter, so
# it needs no vendor account, no credential and no network.
#
# UNSPECIFIED_CALIBRATE marks a threshold with no researched value. It is a
# deliberate refusal to invent a plausible default, because a plausible default
# survives code review. The loader turns it into a sentinel object that raises on
# any numeric comparison or coercion.
#
# Two categories of parameter live here:
#   * data-plumbing facts (staleness, grid resolution) -- defensible without a
#     backtest, so they carry real numbers;
#   * market claims (what counts as "too much convention disagreement") -- these
#     stay sentinels until there is out-of-sample evidence.
#
# Nothing in this repository can place an order: there is no broker adapter and
# no order-placement code. `execution.trading_enabled: true` is rejected by the
# loader for that reason.

stage: DEVELOPMENT
enabled: true

data:
  options_source: synthetic # synthetic | thetadata
  futures_source: none # not implemented
  max_dte: null # null = use everything the adapter supplies

# Every assumption that changes a number. Recorded in each snapshot and hashed
# into the model fingerprint, so changing one here changes the fingerprint.
model:
  pricing_model: black_scholes_merton
  day_count_convention: ACT/365F
  risk_free_rate_source: configured_constant
  dividend_yield_source: configured_constant
  expiration_timestamp_rule: root_specific_settlement
  underlying_price_source: synthetic
  iv_price_source: NBBO_MID_IV
  risk_free_rate: 0.042
  # SPX carries a material dividend yield; leaving this at zero biases gamma.
  dividend_yield: 0.013
  # Gamma diverges as T -> 0. This floor decides how much of that divergence
  # reaches the aggregate. NOT verified against ThetaData's own short-dated
  # handling -- see docs/OPEN_DECISIONS.md. Use compute_floor_sensitivity() to
  # see how much the answer depends on it.
  min_time_to_expiry_minutes: 60.0

# Synchronisation tolerances. Research limits describing when a joined record
# stops representing a single instant; not trading parameters.
data_quality:
  max_quote_greeks_skew_seconds: 5.0
  max_quote_iv_skew_seconds: 5.0
  max_quote_underlying_skew_seconds: 2.0
  max_future_timestamp_seconds: 2.0
  max_snapshot_age_seconds: 60.0
  max_open_interest_age_sessions: 2

gex:
  spot_move_pct: 0.01
  sign_convention: dealer_long_calls_short_puts
  # False forces the shadow pricer everywhere: the zero-gamma grid must reprice
  # gamma in-house regardless, so using one model throughout avoids a
  # discontinuity at the current spot.
  prefer_vendor_gamma: false
  drop_crossed_quotes: true
  require_open_interest: true

zero_gamma:
  grid_span_pct: 0.04
  # Finer than the 25-point SPX strike ladder on a 5000 index.
  grid_step_pct: 0.001
  # sticky_delta is deliberately absent: a true sticky-delta model needs a
  # delta-coordinate surface solved iteratively. The log-moneyness approximation
  # is exposed under its own name, sticky_moneyness.
  conventions: [sticky_strike, frozen_iv, sticky_moneyness]
  max_dte_for_grid: 60
  min_points_for_smile_fit: 5
  boundary_tolerance_pct: 0.10
  max_grid_expansions: 3
  grid_expansion_factor: 1.75

walls:
  node_min_share_of_max: 0.25
  max_nodes_per_side: 5
  void_max_share_of_max: 0.05
  void_min_width_pct: 0.002
  band_pct: 0.10
  directional_wall_min_distance_pct: 0.0
  directional_wall_band_pct: 0.10
  irregular_spacing_factor: 1.5
  min_observed_strikes_for_true_void: 2
  min_ladder_coverage_for_true_void: 0.80

confidence:
  # Data-quality thresholds: measurable facts.
  min_chain_completeness_ratio: 0.90
  crossed_quote_zero_score_ratio: 0.10
  min_universe_coverage_ratio: 0.70
  min_good_iv_ratio: 0.90
  ambiguous_root_spacing_pct: 0.50
  steep_slope_threshold: 0.20
  # Market claims: each needs out-of-sample evidence before it means anything.
  max_zero_gamma_shift_pct: UNSPECIFIED_CALIBRATE
  max_sign_model_disagreement: UNSPECIFIED_CALIBRATE
  max_0dte_dominance_ratio: UNSPECIFIED_CALIBRATE

thetadata:
  base_url: http://127.0.0.1:25503
  auth_mode: local_terminal
  tier: standard
  timeout_seconds: 30.0
  max_retries: 3
  backoff_base_seconds: 0.25
  # Names of environment variables, never values.
  username_env: THETADATA_USERNAME
  password_env: THETADATA_PASSWORD
  greeks_version: latest
  rate_type: sofr
  # null means the parameter is OMITTED and the vendor applies its own default.
  # The number it uses is then unknown, which blocks vendor-IV compatibility --
  # see docs/OPEN_DECISIONS.md OD-22.
  rate_value: null
  rate_units: UNKNOWN
  annual_dividend: null
  dividend_convention: UNKNOWN_VENDOR_CONVENTION
  stock_price_source: vendor_default
  max_dte: 60
  strike_range: null
  min_time: null
  use_market_value: null

  # --- these MUST match the top-level `model:` block ------------------------
  #
  # v2.1.2 shipped `model.iv_price_source: NBBO_MID_IV` next to a ThetaData
  # section that defaulted to VENDOR_DEFAULT_IV. Two different implied
  # volatilities, one file, no complaint -- because the pipeline was built from
  # the ThetaData subsection alone and derived its own ModelSpec.
  #
  # ThetaDataResearchPipeline.from_loaded_config now refuses a file where these
  # disagree.
  iv_source: NBBO_MID_IV
  underlying_price_source: synthetic
  min_time_to_expiry_minutes: 60.0
  expiration_rule: root_specific_settlement

  # Derived from iv_source: every supported IV value is computed by ThetaData,
  # including the NBBO ones. An NBBO *price* basis says nothing about who solved
  # for the volatility. LOCAL_IV_LOCAL_GAMMA would require a local solver, which
  # is not implemented.
  pricing_mode: VENDOR_IV_LOCAL_GAMMA

execution:
  broker: none
  trading_enabled: false
