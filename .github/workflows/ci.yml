name: CI

on:
  push:
    # The repository's branch is `master`. v2.1.3 listed `main` only, so not one
    # job below had ever run on a push: the workflow was green in the sense that
    # nothing red had happened, which is a different thing. `main` stays listed
    # so a later rename cannot silently switch CI off again.
    branches: [master, main]
  pull_request:
  # Lets the 3.12/3.13 evidence be produced on demand rather than only on a
  # push, which matters when a release report has to say what actually ran.
  workflow_dispatch:

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both supported versions. The engine core is stdlib-only, so a
        # difference between them is a genuine incompatibility rather than a
        # dependency-resolution artefact.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy src

      - name: Tests
        # No network access is required or expected: every adapter test runs
        # against the deterministic fake transport.
        run: python -m pytest

      - name: Integration
        run: python -m pytest -m integration

      - name: Regression
        run: python -m pytest -m regression

      - name: Replay
        run: python -m pytest -m replay

      - name: Coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=90

      - name: Demo runs
        run: python -m src.app

  bare-interpreter:
    name: engine core runs without dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute a snapshot with no third-party code installed
        # Deliberately no `pip install -e .`. If the engine core has acquired a
        # third-party import, this job fails with ModuleNotFoundError -- a
        # stronger statement than the in-suite test, because here the packages
        # are absent from the machine rather than merely off sys.path.
        #
        # `tzdata` is installed and is the single exception: it is the IANA
        # timezone database, it ships no importable logic, and since v2.1.7 the
        # engine's Eastern clock is `zoneinfo` rather than a hand-written rule
        # that could not represent the repeated autumn DST hour. The assertion
        # below still fails on any package that is actually code.
        #
        # ubuntu-latest carries a system tz database, so this also proves the
        # engine works when tzdata resolves either way.
        run: |
          pip install "tzdata>=2024.1,<2026.0"
          python -c "
          import sys
          from src.gex.engine import compute_gex_snapshot
          from src.synthetic.chains import build_synthetic_chain
          snapshot = compute_gex_snapshot(build_synthetic_chain())
          third_party = {m.split('.')[0] for m in sys.modules} & {
              'yaml', 'httpx', 'numpy', 'scipy', 'pandas'
          }
          assert not third_party, third_party
          print('engine core runs no third-party code:', snapshot.total_unsigned_gex)
          "

  reproducible-build:
    name: release archive is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Release integrity
        run: python -m pytest tests/unit/test_release_integrity.py -v

      - name: Archive is byte-identical across two runs
        run: |
          git archive --format=zip --output=/tmp/a.zip HEAD
          git archive --format=zip --output=/tmp/b.zip HEAD
          cmp /tmp/a.zip /tmp/b.zip
          echo "archive is reproducible for this commit"

      - name: Determinism -- the same input hashes the same twice
        run: python -m pytest tests/replay tests/regression -v

  invariants:
    name: configuration, storage and parsing invariants
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both supported versions. Python 3.13 added ``__replace__`` to frozen
        # dataclasses, which is exactly the kind of runtime change a safety
        # check must not mistake for an application capability.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"

      - name: Configuration schema validation
        run: python -m pytest tests/unit/test_thetadata_config.py tests/unit/test_thetadata_runtime.py -v

      - name: Raw-store integrity
        run: python -m pytest tests/unit/test_provenance_and_integrity.py -v

      - name: Exact parsing and HTTP status handling
        run: python -m pytest tests/unit/test_exact_parsing.py -v

      - name: Completeness cannot be overstated
        run: python -m pytest tests/unit/test_completeness_confidence.py tests/unit/test_chain_completeness.py tests/unit/test_identity_completeness.py -v

      - name: Research pipeline and pricing compatibility
        run: python -m pytest tests/unit/test_research_pipeline.py -v

      - name: Adapter hardening (transport, store, URLs, exceptions)
        run: python -m pytest tests/unit/test_adapter_hardening.py -v

      - name: Vendor parsing completeness
        run: python -m pytest tests/unit/test_parsing_completeness.py -v

      - name: Model distribution and engine versioning
        run: python -m pytest tests/unit/test_model_distribution.py -v

      - name: Adapter-certification readiness and state machine
        run: python -m pytest tests/unit/test_certification_states.py -v

      - name: Derived certification -- verifier, validator, field provenance
        run: python -m pytest tests/unit/test_adapter_validator.py -v

      - name: Capture plan, raw-store health, per-snapshot manifests
        run: python -m pytest tests/unit/test_capture_plan.py -v

      - name: Observed vendor values are compared, not accepted
        run: python -m pytest tests/unit/test_observations_and_comparators.py -v

      - name: Trusted and diagnostic calculation gates
        run: python -m pytest tests/unit/test_calculation_gate.py -v

      - name: Exact contract identity and the adapter exception hierarchy
        run: python -m pytest tests/unit/test_exact_identity_and_errors.py -v

      - name: Capture profile and the canonical pipeline API
        run: python -m pytest tests/unit/test_capture_profile.py -v

      - name: Exception hierarchy, config construction, identity, hashing
        run: python -m pytest tests/unit/test_boundaries_and_hashing.py -v

      - name: Pricing provenance
        run: python -m pytest tests/unit/test_pricing_provenance.py -v

      - name: Configuration coherence
        run: python -m pytest tests/unit/test_loaded_config_pipeline.py -v

      - name: Identity completeness end to end
        run: python -m pytest tests/unit/test_identity_through_confidence.py -v

      - name: Provenance linkage and versions
        run: python -m pytest tests/unit/test_provenance_linkage.py -v

      - name: Evidence binding -- a chain cannot authorize itself
        run: python -m pytest tests/unit/test_evidence_binding.py -v

      - name: Post-capture compatibility and chain-level coverage
        run: python -m pytest tests/unit/test_post_capture_compatibility.py -v

      - name: One vendor timestamp interpretation
        run: python -m pytest tests/unit/test_vendor_timestamps.py -v

      - name: Normalized-evidence binding -- the chain is re-derived
        run: python -m pytest tests/unit/test_normalized_evidence_binding.py -v

      - name: Capture-operation binding -- the chain does not choose its own inputs
        run: python -m pytest tests/unit/test_capture_operation_binding.py -v

      - name: Settlement evidence is derived, not declared
        run: python -m pytest tests/unit/test_settlement_evidence_resolution.py -v

      - name: Expected universes are re-derived from their source records
        run: python -m pytest tests/unit/test_expected_universe_evidence.py -v

      - name: Operation digests are recomputed; field evidence names its record
        run: python -m pytest tests/unit/test_operation_digest_and_records.py -v

      - name: Capture artifacts survive the process that wrote them
        run: python -m pytest tests/unit/test_artifact_store.py -v

      - name: Expected-universe coverage is derived, not declared
        run: python -m pytest tests/unit/test_expected_universe_evidence.py -v

      - name: Market session dates come from the options-market timezone
        run: python -m pytest tests/unit/test_market_session_date.py -v

      - name: Universe evidence is authorized by a resolution, not by a type
        run: python -m pytest tests/unit/test_expected_universe_evidence.py -v

      - name: The raw-capture command is dry-run by default and never computes
        run: python -m pytest tests/unit/test_raw_capture_command.py -v

      - name: Documentation universe evidence survives a process restart
        run: python -m pytest tests/unit/test_documentation_evidence_recovery.py -v

      - name: No run creates a store nobody asked for
        run: python -m pytest tests/unit/test_capture_integrity.py -v

      - name: US Eastern comes from the IANA database
        run: python -m pytest tests/unit/test_sessions.py tests/unit/test_timestamp_boundary.py -v

      - name: Current-GEX eligibility
        run: python -m pytest tests/unit/test_gex_eligibility.py -v

      - name: Minimal-core dependency isolation
        run: python -m pytest tests/unit/test_core_isolation.py -v

      - name: No embedded credentials, no generated caches
        run: python -m pytest tests/unit/test_release_integrity.py -v

  no-trading-guarantee:
    name: repository cannot trade
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Architecture invariants
        # Separated into its own job so the guarantee is visible as a distinct
        # green check rather than buried inside the suite. Covers: no trading
        # functionality, no broker functionality, no production imports from
        # tests, no embedded credentials.
        run: python -m pytest tests/unit/test_architecture.py -v
