name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint, types, tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both supported versions. The engine core is stdlib-only, so a
        # difference between them is a genuine incompatibility rather than a
        # dependency-resolution artefact.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy src

      - name: Tests
        # No network access is required or expected: every adapter test runs
        # against the deterministic fake transport.
        run: python -m pytest

      - name: Integration
        run: python -m pytest -m integration

      - name: Regression
        run: python -m pytest -m regression

      - name: Replay
        run: python -m pytest -m replay

      - name: Coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report --fail-under=90

      - name: Demo runs
        run: python -m src.app

  bare-interpreter:
    name: engine core runs without dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute a snapshot with nothing installed
        # Deliberately NO `pip install`. If the engine core has acquired a
        # third-party import, this job fails with ModuleNotFoundError -- a
        # stronger statement than the in-suite test, because here the packages
        # are absent from the machine rather than merely off sys.path.
        run: |
          python -c "
          import sys
          from src.gex.engine import compute_gex_snapshot
          from src.synthetic.chains import build_synthetic_chain
          snapshot = compute_gex_snapshot(build_synthetic_chain())
          third_party = {m.split('.')[0] for m in sys.modules} & {
              'yaml', 'httpx', 'numpy', 'scipy', 'pandas'
          }
          assert not third_party, third_party
          print('engine core is dependency-free:', snapshot.total_unsigned_gex)
          "

  reproducible-build:
    name: release archive is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Release integrity
        run: python -m pytest tests/unit/test_release_integrity.py -v

      - name: Archive is byte-identical across two runs
        run: |
          git archive --format=zip --output=/tmp/a.zip HEAD
          git archive --format=zip --output=/tmp/b.zip HEAD
          cmp /tmp/a.zip /tmp/b.zip
          echo "archive is reproducible for this commit"

      - name: Determinism -- the same input hashes the same twice
        run: python -m pytest tests/replay tests/regression -v

  invariants:
    name: configuration, storage and parsing invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Configuration schema validation
        run: python -m pytest tests/unit/test_thetadata_config.py tests/unit/test_thetadata_runtime.py -v

      - name: Raw-store integrity
        run: python -m pytest tests/unit/test_provenance_and_integrity.py -v

      - name: Exact parsing and HTTP status handling
        run: python -m pytest tests/unit/test_exact_parsing.py -v

      - name: Completeness cannot be overstated
        run: python -m pytest tests/unit/test_completeness_confidence.py tests/unit/test_chain_completeness.py tests/unit/test_identity_completeness.py -v

      - name: Research pipeline and pricing compatibility
        run: python -m pytest tests/unit/test_research_pipeline.py -v

      - name: Adapter hardening (transport, store, URLs, exceptions)
        run: python -m pytest tests/unit/test_adapter_hardening.py -v

      - name: Vendor parsing completeness
        run: python -m pytest tests/unit/test_parsing_completeness.py -v

      - name: Model distribution and engine versioning
        run: python -m pytest tests/unit/test_model_distribution.py -v

      - name: Adapter-certification readiness
        run: python -m pytest tests/unit/test_adapter_certification.py -v

      - name: Current-GEX eligibility
        run: python -m pytest tests/unit/test_gex_eligibility.py -v

      - name: Minimal-core dependency isolation
        run: python -m pytest tests/unit/test_core_isolation.py -v

      - name: No embedded credentials, no generated caches
        run: python -m pytest tests/unit/test_release_integrity.py -v

  no-trading-guarantee:
    name: repository cannot trade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Architecture invariants
        # Separated into its own job so the guarantee is visible as a distinct
        # green check rather than buried inside the suite. Covers: no trading
        # functionality, no broker functionality, no production imports from
        # tests, no embedded credentials.
        run: python -m pytest tests/unit/test_architecture.py -v
