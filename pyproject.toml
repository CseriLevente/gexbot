[build-system]
# Bounded at both ends on purpose. An unbounded ``setuptools>=68`` lets a future
# backend release change the produced artefact without a commit in this
# repository, which would make the release archive unreproducible.
requires = ["setuptools>=68,<86"]
build-backend = "setuptools.build_meta"

[project]
name = "gex-futures-bot"
version = "2.1.3"
description = "GEX research engine for SPX/SPXW option chains (research only; cannot trade)"
requires-python = ">=3.12,<3.14"

# The GEX engine core (src/gex, src/domain, src/synthetic) imports nothing from
# this list -- it is pure stdlib maths and stays that way, so the numerics are
# verifiable on a bare interpreter. These dependencies belong to the config
# loader and the ThetaData transport, which are optional at import time.
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
# Real HTTP transport for ThetaData. Not needed for unit tests, which use the
# deterministic fake transport.
http = ["httpx>=0.27,<0.29"]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<0.15",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0,<7.0",
    "httpx>=0.27,<0.29",
]

[tool.setuptools.packages.find]
include = ["src*"]

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "slow: zero-gamma grid sweeps and full-chain runs",
    "integration: offline end-to-end runs through the fake transport",
    "regression: frozen expected values that must not be regenerated",
    "replay: determinism / output-hash checks",
    "network: requires real network access; deselected by default",
]

# --- coverage ---------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/app.py",
    # Empty scaffolding packages for pipeline stages that are not implemented.
    "src/api/*",
    "src/backtest/*",
    "src/broker/*",
    "src/features/*",
    "src/ingest/*",
    "src/reconcile/*",
    "src/regime/*",
    "src/risk/*",
    "src/strategy/*",
    "src/adapters/cboe/*",
    "src/adapters/databento/*",
    "src/adapters/ibkr/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
# Deliberately not 100%: the target is the modules that compute numbers, not
# every logging branch. See docs/VALIDATION.md.
fail_under = 90
show_missing = true
skip_covered = true

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "TID",      # tidy imports (banned-api / relative imports)
    "PT",       # pytest style
    "S",        # flake8-bandit (security)
]
ignore = [
    "E501",    # line length is enforced by the formatter
    "S101",    # assert is how tests assert
    "PT011",   # pytest.raises(ValueError) without match is fine in narrow cases
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into private helpers and build odd inputs on purpose.
# TID251: the banned-api rule targets production code importing from tests;
# test modules sharing fixture builders with each other is intended. The
# real rule is enforced against src/ by test_architecture.py.
"tests/*" = ["S105", "S106", "PT006", "PT007", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"tests".msg = "Production code must never import from tests. Use src.synthetic instead."

[tool.ruff.lint.isort]
known-first-party = ["src"]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
# The engine core carries the strictest settings; adapters that touch untyped
# vendor payloads are allowed to be looser at the boundary only.
plugins = []

[[tool.mypy.overrides]]
module = ["httpx.*", "yaml.*"]
ignore_missing_imports = true
